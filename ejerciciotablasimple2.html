<!DOCTYPE html>
  <html>
    <head>
	  <meta charset="UTF-8">
	  
	  <title>Ejercicios tablas simples</title>
	  
	</head>
    <body bgcolor="white">	
	   <!-- tabla principal -->
      <table border="4" bordercolor="#000000" cellspacing="1" cellpadding="10" align="center" bgcolor="#FFFFFF" width="100%">
          <caption><b>Tabla 2:</b></caption>
		  
        <!-- Fila de encabezados -->
         <tr bgcolor="#FFFFFF" align="center" valign="middle">
         <th rowspan="2"><b>Disco Duro</b></th>
         <th rowspan="2"><b>Capacidad</b></th>
         <th rowspan="2"><b>Interfaz</b></th>
         <th colspan="2"><b>Velocidad de Transferencia</b></th>
         </tr>
        
       <!-- Fila encabezado tambien -->
        
       <tr align="center" valign="middle">
       <td><b>Lectura</b></td>
       <td><b>Escritura</b></td>
       </tr>
      
	  
	  <!-- Fila 1 -->
	  <tr align="center" valign="middle">
      <td>Seagate Barracuda</td>
      <td>2TB</td>
      <td>SATA 6.0 Gb/s</td>
	  <td>7200 rpm</td>
	  <td>-</td>
	  
	  <!-- Fila 2 -->
	  <tr valign="middle">
      <td bgcolor="yellow">WD Blue</td>
      <td bgcolor="yellow">1TB</td>
      <td bgcolor="yellow">SATA 6.0Gb/s</td>
	  <td bgcolor="yellow">5400 RPM</td>
	  <td bgcolor="yellow">-</td>
      
      <!-- Fila 3 -->
	  <tr align="right" valign="middle">
      <td bgcolor="gray">Samsung 970 EVO</td>
      <td bgcolor="gray">500GB</td>
	  <td bgcolor="gray">PCIe NVMe</td>
	  <td bgcolor="gray">3500 MB/s</td>
	  <td bgcolor="gray">2500 MB/s</td>
	  
      <!-- Fila 4 -->
	  <tr align="center" valign="middle">
      <td>LaCie Rugged</td>
	  <td>4TB</td>
	  <td>USB 3.0</td>
	  <td>5400 RPM</td>
	  <td>-</td>
    
      
    </body>
  </html>
