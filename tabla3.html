<!DOCTYPE html>
  <html>
    <head>
	  <meta charset="UTF-8">
	  
	  <title>Ejercicios tablas simples</title>
	  
	</head>
    <body bgcolor="white">	
	   <!-- tabla principal -->
      <table border="4" bordercolor="#000000" cellspacing="1" cellpadding="10" align="center" bgcolor="#FFFFFF" width="100%">
          <caption><b>Tabla 3:</b></caption>
		
        <!-- Fila de encabezados -->
         <tr bgcolor="#FFFFFF" align="center" valign="middle">
         <th rowspan="2"><b>Producto</b></th>
         <th colspan="2"><b>Detalles</b></th>
         <th rowspan="2"><b>Precio</b></th>
         
         </tr>
        
       <!-- Fila encabezado tambien -->
        
       <tr align="center" valign="middle">
       <td><b>Modelo</b></td>
       <td><b>Color</b></td>
       </tr>
      
	  <!-- Fila 1 -->
	  <tr align="center" valign="middle">
      <td rowspan="3">Telefono</td>
      <td>iphone 13</td>
      <td>Blanco</td>
	  <td>799€</td>
	  
	  <!-- Fila 2 -->
	  <tr valign="middle">
      <td>Samsung Galaxy S21</td>
      <td>Negro</td>
      <td>609€</td>
      
      <!-- Fila 3 -->
	  <tr align="right" valign="middle">
      <td>Google Pixel 6</td>
      <td>Azul</td>
	  <td>649€</td>
	  
      <!-- Fila 4 -->
	  <tr align="center" valign="middle">
      <td rowspan="2">Laptop</td>
	  <td>Dell XPS 13</td>
	  <td>Plateado</td>
	  <td>949€</td>
	 
	 <!-- Fila 5 -->
	 <tr align="center" valign="middle">
     <td>MacBookAir</td>
	  <td>Gris</td>
	  <td>1289€</td>
      
    </body>
  </html>
